{% extends "base.html" %}
{% block title %}Entrar · Controle de Energia{% endblock %}
{% block bare %}
<main class="login" id="content">
  <h1 style="margin-bottom:14px">Controle de Energia</h1>
  <form class="card" method="post" action="/login">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="next" value="{{ next }}">
    {% if error %}<div class="flash error">{{ error }}</div>{% endif %}
    <div class="field"><label for="u">Usuário</label><input id="u" name="username" type="text" autocomplete="username" autofocus required></div>
    <div class="field"><label for="p">Senha</label><input id="p" name="password" type="password" autocomplete="current-password" required></div>
    <button class="btn primary" style="width:100%">Entrar</button>
  </form>
</main>
{% endblock %}
