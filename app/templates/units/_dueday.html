{# select do dia de vencimento mensal: {% include %} com `due_value` (int|None) #}
<select id="due_day" name="due_day" aria-describedby="due-hint">
  <option value="">Sem vencimento (não gera aviso)</option>
  {% for d in range(1, 32) %}<option value="{{ d }}" {{ 'selected' if due_value == d }}>Todo dia {{ d }}</option>{% endfor %}
</select>
