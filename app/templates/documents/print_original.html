<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Conta original · Economart Energia</title>
  <style>
    @page { size: A4 {{ 'landscape' if land else 'portrait' }}; margin: 8mm; }
    html, body { margin: 0; background: #fff; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
    .bar { display: flex; gap: 12px; align-items: center; padding: 12px 16px; background: #eaf2fa; color: #1f2937; font-size: 14px; }
    .bar button { background: #1b4f8a; color: #fff; border: 0; border-radius: 6px; padding: 8px 16px; font: inherit; font-weight: 600; cursor: pointer; }
    img { display: block; margin: 12px auto; width: auto; height: auto; max-width: 100%; object-fit: contain; }
    @media print { .bar { display: none; } img { margin: 0 auto; max-width: {{ '279mm' if land else '192mm' }}; max-height: {{ '190mm' if land else '278mm' }}; } }
  </style>
</head>
<body>
  <div class="bar"><button type="button" id="p">Imprimir a conta original</button><span>A página sai na mesma orientação da conta ({{ 'deitada' if land else 'em pé' }}), sem esticar.</span></div>
  <img src="/documents/{{ doc.id }}" alt="Conta original">
  <script nonce="{{ csp_nonce }}">
    document.getElementById('p').addEventListener('click', function () { window.print(); });
    window.addEventListener('load', function () { setTimeout(function () { window.print(); }, 400); });
  </script>
</body>
</html>
